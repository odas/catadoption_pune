<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="A phone holding a message: a photo of a cat with a few lines of writing under it. The words: one message.">
<!-- Card thumbnail for send-a-cat.html, 2026-09-13. Same surface and same rules as
     found-kitten-card.svg: flat brunch ground, ink strokes, uniform width, round caps, and text
     DRAWN rather than live because this is an image and not a page. The page itself keeps every
     word as live text (brand-kit.md §3). Periwinkle ground, per the colour semantics in
     style.css § THE SKETCHBOOK LAYER: peri = the situation. The sky card beside it on learn.html is
     found-kitten, whose message is "wait and watch".
     It answers the card's question for someone who will not read the card: what do I actually send?
     Photos and words together, in one message. -->
  <rect width="600" height="340" fill="#8c78f4"/>
  <g fill="none" stroke="#141118" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- the message: a phone whose screen carries the photo AND the words -->
    <g transform="translate(392,54)">
      <path d="M18 0h122c11 0 18 8 18 20v192c0 12-7 20-18 20H18C7 232 0 224 0 212V20C0 8 7 0 18 0z"/>
      <path d="M62 14h34" stroke-width="4"/>
      <path d="M58 218h42" stroke-width="4"/>
      <!-- the photo, framed inside the screen -->
      <path d="M14 36h130v86H14z" stroke-width="4"/>
      <path d="M56 84l4-22 18 15"/><path d="M102 84l-4-22-18 15"/>
      <circle cx="79" cy="94" r="24"/>
      <path d="M69 92v5M89 92v5" stroke-width="4"/>
      <path d="M79 103l-4 4h8z" stroke-width="3.5"/>
      <!-- the words, under it, in the same message -->
      <path d="M16 146h126" stroke-width="6"/>
      <path d="M16 170h126" stroke-width="6"/>
      <path d="M16 194h74" stroke-width="6"/>
    </g>
  </g>
  <text x="46" y="132" font-family="Martel, Georgia, serif" font-weight="800" font-size="72" letter-spacing="-2" fill="#141118">ONE</text>
  <text x="46" y="204" font-family="Martel, Georgia, serif" font-weight="800" font-size="72" letter-spacing="-2" fill="#141118">MESSAGE.</text>
  <text x="46" y="250" font-family="Hind, Helvetica, Arial, sans-serif" font-weight="600" font-size="23" fill="#141118">Photos, age, area, a number.</text>
  <text x="46" y="280" font-family="Hind, Helvetica, Arial, sans-serif" font-weight="600" font-size="23" fill="#141118">That is the whole thing.</text>
</svg>
